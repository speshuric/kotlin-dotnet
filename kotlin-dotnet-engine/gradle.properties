# Указать Gradle где искать JDK (локальный .sdk/jdk).
# Активируется через JAVA_HOME из scripts/activate.sh.
# Путь относительный от корня Gradle-проекта. Симлинк kotlin-dotnet-engine/.sdk
# -> ../.sdk делает его валидным и при запуске из движка, и при composite-
# синке из корня репозитория (база резолва — корень верхнеуровневого билда).
# При composite-запуске свойства обоих билдов объединяются в список
# кандидатов; несуществующие пути дают только warning.
org.gradle.java.installations.paths=.sdk/jdk

# Безопаснее: не скачивать toolchain из сети.
org.gradle.java.installations.auto-download=false
