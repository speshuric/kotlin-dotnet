# Tell Gradle where to find the JDK (local .sdk/jdk).
# Activated via JAVA_HOME from scripts/activate.sh.
# The path is relative to the Gradle project root. The kotlin-dotnet-engine/.sdk symlink
# -> ../.sdk keeps it valid both when run from the engine and during composite
# sync from the repository root (the resolve base is the top-level build root).
# On a composite run, the properties of both builds are merged into one list of
# candidates; nonexistent paths only produce a warning.
org.gradle.java.installations.paths=.sdk/jdk

# Safer: do not download toolchains from the network.
org.gradle.java.installations.auto-download=false
