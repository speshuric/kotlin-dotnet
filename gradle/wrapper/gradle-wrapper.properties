# Wrapper-свойства только для IDE: IntelliJ IDEA в режиме "Use Gradle from:
# 'wrapper'..." читает этот файл и берёт дистрибутив нужной версии.
#
# CLI-запуски из корня НЕ поддерживаются: сборка идёт через
# kotlin-dotnet-engine/gradlew (см. settings.gradle.kts). Скрипты gradlew и
# gradle-wrapper.jar в корень не кладутся; корневой таск wrapper отключён
# (build.gradle.kts), чтобы IDEA не генерировала их заново.
#
# Версия синхронизирована с kotlin-dotnet-engine/gradle/wrapper/.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.0-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
