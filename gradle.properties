# Root Gradle properties — applied when configuring the composite build
# from the repository root (IntelliJ IDEA sync does exactly that).
#
# IMPORTANT: relative paths here resolve against the invocation root
# (the repository root). For runs inside kotlin-dotnet-engine, its own
# kotlin-dotnet-engine/gradle.properties applies with its own relative
# path. See docs and scripts/activate.sh.

# Project-local JDK (toolchain 21) — no reliance on system JVMs.
org.gradle.java.installations.paths=.sdk/jdk

# Do not download toolchains from the network (the JDK lives locally in .sdk/jdk).
org.gradle.java.installations.auto-download=false
