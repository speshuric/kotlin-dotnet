# Корневые свойства Gradle — применяются при конфигурации composite-сборки
# из корня репозитория (так делает синк IntelliJ IDEA).
#
# ВАЖНО: относительные пути здесь резолвятся от корня invocation
# (корень репозитория). Для запуска внутри kotlin-dotnet-engine действует
# свой файл kotlin-dotnet-engine/gradle.properties со своим относительным
# путём. См. docs и scripts/activate.sh.

# Локальный JDK проекта (тулчейн 21) — без обращения к системным JVM.
org.gradle.java.installations.paths=.sdk/jdk

# Не скачивать toolchain из сети (JDK живёт локально в .sdk/jdk).
org.gradle.java.installations.auto-download=false
